.dashboard-panel,
.workspace-masthead,
.project-masthead:not(.subview),
.checkout-ledger > .ledger-region {
  border: 1px solid var(--rule);
  border-radius: var(--radius-panel);
  background: var(--sheet);
  box-shadow:
    inset 0 1px var(--rim),
    0 8px 22px var(--shadow);
}
.dashboard-panel {
  min-width: 0;
  padding: clamp(13px, 1.25vw, 21px);
}
.dashboard-heading {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.dashboard-heading h2 {
  font-size: var(--type-panel);
  font-weight: 650;
}
.dashboard-heading > .visual-icon {
  color: var(--accent);
}
.dashboard-heading > .badge {
  margin-inline-start: auto;
}
.workspace-masthead {
  position: relative;
  display: flex;
  align-items: center;
  isolation: isolate;
  grid-column: 1 / -1;
  min-height: clamp(184px, 16vw, 242px);
  padding: 20px 0 26px;
  border: 0;
  border-bottom: 1px solid var(--rule);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}
.workspace-masthead .masthead-copy {
  z-index: 1;
  min-width: 0;
  max-width: 54%;
}
.workspace-masthead h1 {
  font-size: clamp(36px, 4.3vw, 72px);
  line-height: 1.05;
}
.workspace-masthead h1 + p {
  max-width: 44ch;
  margin-top: 10px;
  color: var(--sub);
}
.workspace-masthead .work-actions {
  margin-top: 18px;
}
.workspace-masthead .spectral-field {
  position: absolute;
  inset: 0 0 0 auto;
  width: 56%;
  height: 100%;
  mask-image: linear-gradient(90deg, transparent, black 18%);
}
.workspace-masthead .spectral-seal {
  right: 7%;
  top: 30%;
  width: clamp(42px, 4.6vw, 80px);
}
.graph-atlas {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 12px;
  text-align: start;
}
.graph-atlas:hover,
.graph-atlas:focus-visible {
  border-color: var(--accent);
}
.atlas-title {
  display: flex;
  gap: 8px;
  align-items: center;
  font-weight: 600;
}
.atlas-title > :last-child {
  margin-inline-start: auto;
  color: var(--accent);
}
.graph-atlas > svg {
  display: block;
  width: 100%;
  height: 120px;
}
.atlas-orbits {
  fill: none;
  stroke: var(--rule);
  stroke-dasharray: 2 4;
}
.atlas-links {
  fill: none;
  stroke: var(--green);
}
.atlas-links path + path {
  stroke: var(--accent);
}
.atlas-labels {
  fill: var(--sub);
  text-anchor: middle;
  font: 13px var(--sans);
}
.atlas-labels circle {
  fill: var(--green);
}
.atlas-hub {
  fill: var(--band);
  stroke: var(--accent);
}
.atlas-mark {
  fill: var(--accent);
  text-anchor: middle;
  font: 30px var(--display);
}
.workspace-dashboard .desk-resume {
  border-inline-start: 3px solid var(--accent);
}
.workspace-dashboard .directory-row {
  box-shadow: none;
}
.workspace-dashboard .workspace-activity {
  border-inline: 0;
  border-bottom: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  padding-inline: 0;
}
.project-register .register-heading {
  margin-block: 3px 10px;
}
.project-register .register-heading .badge {
  margin-inline-start: 0;
}
.directory ul {
  display: grid;
  gap: 7px;
}
.directory-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(115px, 0.57fr) 17px;
  width: 100%;
  min-height: 61px;
  align-items: center;
  gap: 11px;
  padding: 8px 12px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--sheet);
  color: var(--text);
  text-align: start;
}
.directory-row:hover {
  border-color: var(--control-rule);
  background: var(--raised);
}
.directory-row:focus-visible {
  outline-offset: 2px;
}
.directory-project {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 10px;
}
.directory-name,
.directory-observation {
  min-width: 0;
}
.directory-name :is(strong, small, code),
.directory-observation small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.directory-name :is(small, code),
.directory-observation small {
  margin-top: 2px;
  color: var(--dim);
  font-size: var(--type-meta);
}
.directory-observation {
  text-align: end;
}
.directory-row > .visual-icon {
  color: var(--accent);
}
.directory-project .project-initial,
.dashboard-icon {
  display: inline-grid;
  flex: none;
  width: 32px;
  height: 32px;
  place-items: center;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--band);
  color: var(--accent);
}
.activity-row,
.desk-link {
  display: flex;
  width: 100%;
  min-height: 48px;
  align-items: center;
  gap: 9px;
  padding: 7px 5px;
  color: var(--sub);
  text-align: start;
}
.activity-row:hover,
.desk-link:hover {
  border-radius: 8px;
  background: var(--raised);
  color: var(--text);
}
.activity-row span + span,
.desk-link span + span {
  min-width: 0;
}
.activity-row :is(strong, small),
.desk-link :is(strong, small) {
  display: block;
  overflow-wrap: anywhere;
}
.activity-row small,
.desk-link small {
  margin-top: 2px;
  color: var(--dim);
  font-size: var(--type-meta);
}
.activity-row time,
.desk-link > .visual-icon:last-child {
  flex: none;
  margin-inline-start: auto;
  color: var(--dim);
}
.workspace-activity li + li,
.desk-link + .desk-link {
  border-top: 1px solid var(--rule);
}
.desk-project-name {
  margin-top: 8px;
  font: 540 clamp(25px, 2.35vw, 35px) / 1.1 var(--display);
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}
.desk-resume {
  background: linear-gradient(142deg, var(--band), var(--sheet) 70%);
}
.desk-section .button {
  margin-top: 13px;
}
.desk-branch {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 32px;
  margin-top: 6px;
  color: var(--accent);
  overflow-wrap: anywhere;
}
.desk-changes {
  margin-bottom: 4px;
  color: var(--sub);
  font-size: var(--type-label);
}
.workspace-facts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.workspace-facts > div {
  display: flex;
  min-width: 0;
  flex-direction: column-reverse;
  gap: 2px;
  padding: 8px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--bg);
}
.workspace-facts dt {
  color: var(--dim);
  font-size: var(--type-meta);
}
.workspace-facts dd {
  margin: 0;
  color: var(--text);
  font: 520 26px / 1.1 var(--display);
}
.workspace-health,
.health-signal {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 10px;
}
.workspace-health {
  margin-top: 12px;
  color: var(--dim);
  font-size: var(--type-meta);
}
.workspace-health > span:last-child {
  max-width: 100%;
}
.health-signal.ready {
  color: var(--green);
}
.health-signal.error {
  color: var(--red);
}

.project-masthead {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(160px, 1fr);
  align-items: center;
  gap: 12px;
  margin-bottom: 19px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--rule);
}
.project-horizon {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
}
.project-masthead .spectral-field {
  height: clamp(89px, 8vw, 131px);
}
.project-masthead .spectral-seal {
  width: clamp(38px, 4vw, 63px);
}
.project-masthead h1 {
  font-size: clamp(33px, 4vw, 54px);
}
.project-masthead.subview {
  min-height: 66px;
}
.project-masthead.subview h1 {
  font-size: 29px;
}
.project-identifiers {
  display: flex;
  flex-wrap: wrap;
  align-items: start;
  gap: 2px 14px;
  margin-top: 9px;
}
.project-branch-inline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  color: var(--sub);
  overflow-wrap: anywhere;
}
.project-identity {
  min-width: 0;
}
.project-identity .project-path {
  flex: 1 1 230px;
  min-width: 0;
  margin: 0;
  font-size: var(--type-meta);
}
.masthead-refresh {
  justify-self: end;
  min-height: 35px;
}

.resume-surface {
  display: grid;
  min-width: 0;
  gap: 12px;
}
.resume-binding {
  color: var(--sub);
}
.cockpit-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 15px;
}
.cockpit-strip .project-tabs {
  margin-bottom: 0;
}
.resume-directive {
  display: grid;
  grid-template-columns: minmax(140px, 0.32fr) minmax(0, 1.7fr);
  align-items: baseline;
  gap: 4px 20px;
  padding: 11px 16px;
  border-left: 3px solid var(--accent);
  background: var(--band);
}
.directive-label {
  grid-row: 1/3;
  align-self: center;
}
.directive-label h2 {
  margin-bottom: 3px;
  font-size: 17px;
}
.resume-directive h3 {
  font-size: 17px;
  font-weight: 650;
}
.resume-directive .next-action-rationale {
  margin: 0;
  color: var(--sub);
}
.resume-directive :is(.cockpit-conflicts, .work-message, .badge.warning) {
  grid-column: 2;
}
.checkout-ledger {
  display: grid;
  gap: 0;
  grid-template-columns: minmax(0, 1fr) minmax(215px, 0.68fr);
  grid-template-areas:
    "decision git"
    "activity git";
  border: 1px solid var(--rule);
  background: var(--sheet);
}
.ledger-region {
  min-width: 0;
  padding: clamp(16px, 1.6vw, 27px);
  overflow-wrap: anywhere;
}
.ledger-region h2 {
  font-size: var(--type-panel);
}
.decision-sheet {
  grid-area: decision;
}
.decision-sheet .work-panel-heading h2 {
  font: 540 24px / 1.14 var(--display);
}
.decision-sheet .cockpit-decision-body {
  margin: 5px 0;
  padding: 0 0 0 14px;
  border: solid var(--accent);
  border-width: 0 0 0 2px;
  border-radius: 0;
  background: transparent;
  font: 490 clamp(19px, 1.75vw, 26px) / 1.27 var(--sans);
}
.decision-sheet .cockpit-actions {
  padding-top: 10px;
  border-top: 1px solid var(--rule);
}
.decision-maintenance {
  margin-top: 7px;
  color: var(--sub);
  font-size: var(--type-label);
}
.decision-maintenance summary {
  width: fit-content;
  padding-block: 6px;
  cursor: pointer;
}
.git-register {
  grid-area: git;
  border-inline-start: 1px solid var(--rule);
  background: var(--panel);
}
.git-register .checkout-counts {
  gap: 0;
  grid-template-columns: 1fr;
}
.git-register .checkout-counts > div {
  flex-direction: row;
  justify-content: space-between;
  border: solid var(--rule);
  border-width: 0 0 1px;
  border-radius: 0;
  background: transparent;
}
.git-register .checkout-details > div {
  flex-wrap: wrap;
}
.activity-rail {
  grid-area: activity;
  border-top: 1px solid var(--rule);
}
.activity-rail .activity-header {
  display: grid;
}
.activity-rail .activity-header time {
  grid-row: 1;
}
.checkout-ledger.without-decision {
  grid-template: "git" / 1fr;
}
.checkout-ledger.without-decision .git-register {
  border-inline-start: 0;
}
@container (min-width: 940px) {
  .checkout-ledger {
    grid-template:
      "activity decision git" / minmax(161px, 0.62fr) minmax(0, 1.75fr)
      minmax(245px, 0.9fr);
  }
  .activity-rail {
    border-top: 0;
    border-inline-end: 1px solid var(--rule);
  }
}
@container (max-width: 650px) {
  .checkout-ledger {
    grid-template: "decision" "git" "activity" / minmax(0, 1fr);
  }
  .git-register {
    border-inline-start: 0;
    border-top: 1px solid var(--rule);
  }
  .resume-directive {
    grid-template-columns: minmax(0, 1fr);
  }
  .directive-label {
    grid-row: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .resume-directive :is(.cockpit-conflicts, .work-message, .badge.warning) {
    grid-column: 1;
  }
}

.investigation-grid,
.task-layout,
.git-layout {
  gap: 0;
  border: 1px solid var(--rule);
  background: var(--sheet);
}
.investigation-grid .panel,
.task-layout > .panel,
.git-layout > .panel {
  border: 0;
  border-radius: 0;
  background: transparent;
}
.investigation-grid .work-disclosure {
  border-top: 1px solid var(--rule);
}
.investigation-inspector,
.task-detail,
.git-layout > .panel + .panel {
  border-top: 1px solid var(--rule);
}
.investigation-inspector {
  gap: 0;
  background: var(--panel);
}
.investigation-inspector .desk-link {
  padding: 10px 18px;
}
.investigation-sheet .context-search {
  margin: 0;
}
.investigation-sheet .search-controls {
  margin-block: 12px;
}
.investigation-sheet .search-preview {
  background: var(--panel);
}
@container (min-width: 690px) {
  .investigation-grid {
    grid-template-columns: minmax(0, 1.45fr) minmax(285px, 0.8fr);
  }
  .investigation-inspector,
  .task-layout > .task-detail,
  .git-layout > .panel + .panel {
    border-top: 0;
    border-inline-start: 1px solid var(--rule);
  }
  .investigation-grid,
  .task-layout,
  .git-layout {
    align-items: stretch;
  }
  .investigation-inspector {
    align-content: start;
  }
}
.task-filters {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(120px, 0.6fr);
  gap: 8px;
  margin-bottom: 12px;
}
.task-detail .task-objective {
  margin-block: 12px 20px;
}
.git-layout .git-file {
  min-height: 46px;
}
.git-layout .git-diff .work-panel-heading h4 {
  font-size: 16px;
}
.comparison-view {
  min-width: 0;
  margin: 10px 0;
}
.comparison-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}
.comparison-toolbar button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.comparison-split {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.comparison-version {
  min-width: 0;
  margin: 0;
}
.comparison-version figcaption {
  padding: 5px 8px;
  border: 1px solid var(--rule);
  border-bottom: 0;
  background: var(--raised);
  color: var(--sub);
  font-size: var(--type-meta);
}
.comparison-version .version-lines {
  margin: 0;
  border-radius: 0 0 5px 5px;
}
.version-lines > span {
  display: block;
  min-width: max-content;
}
.line-number {
  display: inline-block;
  width: 3ch;
  margin-right: 1.2ch;
  color: var(--dim);
  text-align: end;
}

.preferences {
  max-width: 1010px;
}
.settings-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px 28px;
  padding: 20px 0;
  border-top: 1px solid var(--rule);
}
.settings-row h2 {
  font-size: 20px;
}
.settings-row p {
  max-width: 64ch;
  margin-top: 5px;
  color: var(--sub);
}
.theme-options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.theme-option {
  display: grid;
  gap: 5px;
  min-width: 79px;
  padding: 8px;
  border: 1px solid var(--control-rule);
  border-radius: 7px;
  background: var(--sheet);
  text-align: start;
}
.theme-option:hover,
.theme-option[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--soft);
}
.theme-option > span {
  height: 15px;
  border-radius: 3px;
}
.theme-option [data-swatch="Noir"] {
  background: #241c2a;
}
.theme-option [data-swatch="Astra"] {
  background: #1f3649;
}
.theme-option [data-swatch="Quartz"] {
  background: #e9e1d4;
}
.local-status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--sub);
}

.command-palette {
  width: min(560px, calc(100vw - 30px));
  padding: 0;
}
.palette-search {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--rule);
  color: var(--sub);
}
.palette-search input {
  flex: 1;
  min-width: 0;
  padding: 8px 10px;
  border: 1px solid var(--control-rule);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
}
.palette-results {
  max-height: min(55vh, 420px);
  overflow: auto;
  padding: 6px;
}
.palette-result {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  width: 100%;
  min-height: 37px;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  border-radius: 5px;
  text-align: start;
}
.palette-result:hover,
.palette-result[data-current="true"] {
  background: var(--raised);
}
.palette-result small,
.palette-keys,
.palette-empty {
  color: var(--sub);
  font-size: var(--type-meta);
}
.palette-keys,
.palette-empty {
  padding: 8px 13px;
}
.palette-keys {
  border-top: 1px solid var(--rule);
}
.palette-keys kbd {
  margin-inline-end: 4px;
}

@media (max-width: 760px) {
  .living-shell {
    display: block;
    --titlebar-height: 49px;
  }
  .living-shell .desktop-rail {
    position: static;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    height: auto;
    padding: 5px 12px;
    overflow: visible;
    border-right: 0;
    border-bottom: 1px solid var(--rule);
  }
  .rail-group {
    display: flex;
    flex-wrap: wrap;
    column-gap: 5px;
    grid-column: 1/-1;
    padding: 4px 0;
  }
  .rail-link {
    width: auto;
    min-height: 34px;
    padding-inline: 6px;
  }
  .rail-caption {
    align-self: center;
    margin: 0;
    padding-inline: 5px;
  }
  .rail-group ul {
    display: flex;
    flex-wrap: wrap;
  }
  .rail-group.rail-destinations {
    border-bottom: 0;
  }
  .rail-destinations .rail-link {
    padding-inline: 7px;
  }
  .rail-previews {
    display: none;
  }
  .rail-foot {
    grid-area: 1/2;
    align-self: center;
    padding: 0;
  }
  .rail-group:first-child {
    grid-column: 1;
    border-bottom: 0;
  }
  .living-shell .brand {
    flex-basis: auto;
    padding-inline: 11px;
    font-size: 22px;
  }
  .living-shell .brand-mark {
    width: 28px;
    height: 28px;
  }
  .living-shell .main {
    padding: 16px;
  }
  .project-register {
    padding: 17px 0;
  }
}
@media (max-width: 540px) {
  .command-trigger span,
  .command-trigger kbd,
  .shell-context,
  .living-shell .breadcrumb-separator,
  .rail-group:first-child .rail-link small,
  .rail-destinations .rail-caption {
    display: none;
  }
  .living-shell .breadcrumb strong {
    display: inline;
  }
  .living-shell .brand {
    gap: 4px;
  }
  .workspace-masthead {
    grid-template-columns: minmax(0, 1fr);
    min-height: 0;
  }
  .workspace-masthead .spectral-field {
    height: 94px;
  }
  .directory-project {
    gap: 7px;
  }
  .project-masthead {
    grid-template-columns: minmax(0, 1fr) minmax(83px, 0.68fr);
  }
  .project-masthead.subview {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .project-masthead .spectral-field {
    height: 76px;
  }
  .project-horizon {
    grid-template-columns: minmax(0, 1fr);
    gap: 3px;
  }
  .project-identifiers {
    gap: 0;
  }
  .rail-destinations .rail-link .visual-icon {
    display: none;
  }
  .task-filters {
    grid-template-columns: minmax(0, 1fr);
  }
}

.rail-field {
  position: relative;
  height: clamp(50px, 8vh, 92px);
  overflow: hidden;
  pointer-events: none;
  color: var(--seal);
  mask-image: linear-gradient(
    to right,
    transparent,
    black 12%,
    black 85%,
    transparent
  );
}
.rail-field::before {
  content: "";
  position: absolute;
  inset: 0 -14% -15%;
  background: radial-gradient(
    ellipse at 44% 74%,
    color-mix(in srgb, var(--seal) 17%, transparent),
    transparent 56%
  );
}
.rail-field svg {
  position: absolute;
  inset: 0 -5%;
  width: 110%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 0.75;
  opacity: 0.62;
}
.rail-field path:nth-child(3n) {
  opacity: 0.52;
}
@media (prefers-reduced-motion: no-preference) {
  .rail-field svg,
  .rail-field::before {
    animation: rail-tide 9s ease-in-out infinite alternate;
    transform-origin: 45% 90%;
  }
  .rail-field::before {
    animation-direction: alternate-reverse;
    animation-duration: 13s;
  }
  [data-motion-paused="true"] .rail-field svg,
  [data-motion-paused="true"] .rail-field::before {
    animation-play-state: paused;
  }
}
@keyframes rail-tide {
  from {
    transform: translateX(-3%) scaleY(0.83);
  }
  to {
    transform: translateX(3%) scaleY(1.06);
  }
}
@media (max-height: 570px) {
  .rail-field {
    display: none;
  }
}

.rail-system {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 8px;
  padding: 10px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: linear-gradient(145deg, var(--band), var(--sheet));
  color: var(--text);
  font-size: var(--type-label);
}
.rail-system .lambda-mark {
  width: 24px;
  height: 24px;
  color: var(--accent);
}
.rail-system small {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--dim);
  font-size: var(--type-meta);
}
.rail-system .ready {
  color: var(--green);
}
.rail-system .error {
  color: var(--red);
}
.project-tabs {
  display: flex;
  width: fit-content;
  max-width: 100%;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  margin-bottom: 17px;
  padding: 4px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--sheet);
  box-shadow: inset 0 1px var(--rim);
}
.project-tabs button {
  display: flex;
  min-height: 35px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 4px 13px;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--sub);
  font-size: var(--type-ui);
  font-weight: 550;
}
.project-tabs button:hover {
  background: var(--raised);
  color: var(--text);
}
.project-tabs button[aria-current="page"] {
  border-color: var(--accent);
  background: var(--soft);
  color: var(--accent);
  font-weight: 650;
}
.project-masthead:not(.subview) {
  min-height: 130px;
  padding: 10px clamp(12px, 1.5vw, 25px);
  margin-bottom: 12px;
  background: linear-gradient(120deg, var(--band), var(--sheet) 75%);
}
.project-masthead.subview {
  margin-bottom: 10px;
  border-bottom: 0;
}
@container (min-width: 690px) {
  .project-masthead.subview {
    grid-template-columns: minmax(0, 1fr) auto;
    min-height: 44px;
    padding-bottom: 0;
  }
  .project-masthead.subview .project-identity {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .project-masthead.subview .project-identifiers {
    flex: 1;
    min-width: 0;
    margin-top: 0;
  }
}
.resume-directive {
  border: 1px solid var(--rule);
  border-inline-start: 3px solid var(--accent);
  border-radius: var(--radius-panel);
}
.checkout-ledger {
  gap: 12px;
  border: 0;
  background: none;
}
.checkout-ledger > .git-register {
  background: var(--panel);
}
.project-followup {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
  margin-top: 12px;
}
.task-digest .text-button {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-inline-start: auto;
  font-size: var(--type-label);
}
.task-digest ul li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: 6px;
  overflow-wrap: anywhere;
}
.task-digest li + li {
  border-top: 1px solid var(--rule);
}
.task-digest li small {
  display: block;
  margin-top: 2px;
  color: var(--dim);
  font-size: var(--type-meta);
}
@container (min-width: 690px) {
  .project-followup {
    grid-template-columns: minmax(0, 1.34fr) minmax(0, 1fr);
  }
}
.investigation-grid,
.task-layout,
.git-layout {
  border-radius: var(--radius-panel);
  box-shadow: inset 0 1px var(--rim);
}
.investigation-inspector {
  border-end-start-radius: var(--radius-panel);
  border-end-end-radius: var(--radius-panel);
}
@container (min-width: 690px) {
  .investigation-inspector {
    border-start-end-radius: var(--radius-panel);
    border-end-start-radius: 0;
  }
}
@media (max-width: 1000px) {
  .workspace-dashboard {
    grid-template-columns: minmax(0, 1fr);
  }
  .continuity-desk {
    grid-template-columns: repeat(auto-fit, minmax(min(228px, 100%), 1fr));
  }
}
@media (max-width: 760px) {
  .rail-field,
  .rail-system {
    display: none;
  }
}
@media (max-width: 540px) {
  .workspace-masthead {
    min-height: 0;
  }
  .workspace-masthead .masthead-copy {
    max-width: 100%;
  }
  .workspace-masthead .spectral-field {
    top: -12px;
    width: 36%;
    height: 55px;
    opacity: 0.65;
  }
  .workspace-masthead .spectral-seal {
    display: none;
  }
  .project-tabs {
    width: 100%;
  }
  .project-tabs button {
    flex: 1 1 auto;
    padding-inline: 6px;
  }
  .project-tabs .visual-icon {
    display: none;
  }
  .directory-row {
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.65fr) 15px;
    gap: 5px;
    padding-inline: 8px;
  }
  .activity-row {
    flex-wrap: wrap;
  }
}


.preview-lab {
  min-width: 0;
  display: grid;
  gap: 16px;
}

.lab-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 18px;
  min-height: 44px;
  padding: 6px 14px;
  border: 1px solid var(--rule);
  border-inline-start: 3px solid var(--accent);
  border-radius: 10px;
  background: var(--band);
  color: var(--accent);
  font-size: var(--type-label);
  font-weight: 600;
}

.lab-status-id {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.lab-status small {
  margin-inline-start: 4px;
  color: var(--sub);
  font-size: var(--type-meta);
  font-weight: 450;
}

.lab-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px;
  overflow-x: auto;
  scrollbar-width: thin;
  scroll-snap-type: inline proximity;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--sheet);
  box-shadow: inset 0 1px var(--rim);
}

.lab-strip-item {
  position: relative;
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: 7px;
  min-height: 36px;
  padding: 4px 11px;
  border: 1px solid transparent;
  border-radius: 8px;
  scroll-snap-align: start;
  color: var(--sub);
  font-size: var(--type-label);
  font-weight: 540;
  white-space: nowrap;
}

.lab-strip-item:hover {
  background: var(--raised);
  color: var(--text);
}

.lab-strip-item[aria-current="page"] {
  border-color: var(--accent);
  background: var(--soft);
  color: var(--text);
  font-weight: 640;
}

.lab-strip-item[aria-current="page"]::after {
  content: "";
  position: absolute;
  inset: auto 10px 0;
  border-block-end: 2px solid var(--accent);
}

.lab-strip-item[aria-current="page"] .visual-icon {
  color: var(--accent);
}

.lab-strip-item small {
  padding: 1px 5px;
  border: 1px solid var(--rule);
  border-radius: 5px;
  color: var(--dim);
  font: 550 11px / 1.2 var(--mono);
}

/* Lab Index Masthead & Gallery */

.lab-masthead {
  position: relative;
  display: flex;
  align-items: center;
  isolation: isolate;
  min-height: clamp(190px, 16vw, 240px);
  padding: 18px 0 24px;
  border-bottom: 1px solid var(--rule);
}

.lab-masthead-copy {
  position: relative;
  z-index: 1;
  min-width: 0;
  max-width: 58%;
}

.lab-masthead h1 {
  font-size: clamp(36px, 4.1vw, 66px);
  line-height: 1.05;
}

.lab-masthead p {
  max-width: 48ch;
  margin-top: 10px;
  color: var(--sub);
}

.lab-telemetry {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.lab-telemetry > div {
  display: flex;
  flex-direction: column-reverse;
  min-width: 106px;
  padding: 8px 12px;
  border: 1px solid var(--rule);
  border-radius: 9px;
  background: var(--sheet);
}

.lab-telemetry dt {
  color: var(--dim);
  font-size: var(--type-meta);
}

.lab-telemetry dd {
  margin: 0;
  color: var(--text);
  font: 540 22px / 1.15 var(--display);
}

.lab-masthead .spectral-field {
  position: absolute;
  inset: 0 0 0 auto;
  width: 52%;
  height: 100%;
  mask-image: linear-gradient(90deg, transparent, black 20%);
}

.lab-masthead .spectral-seal {
  right: 7%;
  top: 32%;
  width: clamp(42px, 4.5vw, 76px);
}

.lab-index-groups {
  display: grid;
  gap: 24px;
}

.lab-gallery {
  display: grid;
  gap: 12px;
}

.lab-gallery-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px 18px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--rule);
}

.lab-gallery-head h2 {
  font: 560 22px / 1.18 var(--display);
}

.lab-gallery-head p {
  color: var(--sub);
  font-size: var(--type-label);
}

.lab-specimen-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(272px, 100%), 1fr));
  gap: 12px;
}

.lab-specimen {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  padding: 14px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-panel);
  background: var(--sheet);
  box-shadow:
    inset 0 1px var(--rim),
    0 6px 16px var(--shadow);
  color: var(--text);
  text-align: start;
  transition:
    border-color 140ms ease-out,
    background-color 140ms ease-out;
}

.lab-specimen:hover,
.lab-specimen:focus-visible {
  border-color: var(--accent);
  background: var(--panel);
}

.lab-specimen-visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  margin-bottom: 12px;
  border: 1px solid var(--rule);
  border-radius: 9px;
  background:
    radial-gradient(circle, var(--rule) 0.7px, transparent 0.9px) 0 0 / 12px
      12px,
    linear-gradient(135deg, var(--band), var(--bg) 78%);
}

.lab-thumb {
  width: 88px;
  height: 52px;
  overflow: visible;
}

.lab-milestone-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--bg);
  color: var(--accent);
  font: 600 11px / 1.3 var(--mono);
}

.lab-specimen-body {
  display: grid;
  gap: 5px;
  margin-bottom: 12px;
}

.lab-specimen-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
}

.lab-specimen-title .visual-icon {
  color: var(--accent);
}

.lab-specimen-body small {
  color: var(--sub);
  font-size: var(--type-label);
  line-height: 1.4;
}

.lab-specimen-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 9px;
  border-top: 1px solid var(--rule);
  color: var(--accent);
  font-size: var(--type-meta);
  font-weight: 600;
}

/* Lab Experiment Header */

.lab-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px 24px;
  padding: 18px clamp(16px, 2vw, 26px);
  border: 1px solid var(--rule);
  border-radius: var(--radius-panel);
  background: linear-gradient(125deg, var(--band), var(--sheet) 68%);
  box-shadow: inset 0 1px var(--rim);
  overflow: hidden;
  isolation: isolate;
}

.lab-hero-copy {
  position: relative;
  z-index: 1;
  min-width: 0;
  max-width: 64ch;
}

.lab-hero-eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin-bottom: 6px;
}

.lab-hero-eyebrow .eyebrow {
  margin-bottom: 0;
}

.lab-hero h1 {
  font-size: clamp(29px, 3vw, 44px);
}

.lab-hero-copy p {
  margin-top: 6px;
  color: var(--sub);
}

.lab-hero-controls {
  position: relative;
  z-index: 1;
}

.scenario-control {
  min-width: 184px;
}

.lab-banner-motif {
  position: absolute;
  inset: 0 0 0 auto;
  width: min(46%, 440px);
  height: 100%;
  pointer-events: none;
  color: var(--seal);
  opacity: 0.45;
  mask-image: linear-gradient(90deg, transparent, black 28%);
}

.lab-banner-motif svg {
  width: 100%;
  height: 100%;
}

.motif-ridges {
  fill: none;
  stroke: currentColor;
  stroke-width: 0.75;
  opacity: 0.34;
}

.motif-orbit {
  fill: none;
  stroke: currentColor;
  stroke-dasharray: 3 4;
  opacity: 0.38;
}

.motif-lambda {
  fill: currentColor;
  font: 28px var(--display);
  text-anchor: middle;
  opacity: 0.72;
}

/* Lab Visual Instruments */

.lab-stack {
  display: grid;
  gap: 14px;
}

.lab-instrument {
  margin: 0;
  border: 1px solid var(--rule);
  border-radius: var(--radius-panel);
  background: var(--sheet);
  box-shadow:
    inset 0 1px var(--rim),
    0 6px 18px var(--shadow);
  overflow: hidden;
}

.instrument-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
}

.instrument-eyebrow {
  color: var(--accent);
  font-size: var(--type-meta);
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.instrument-meta {
  color: var(--sub);
  font-size: var(--type-meta);
}

.instrument-stage {
  overflow-x: auto;
  padding: 10px 14px;
  background:
    radial-gradient(circle, var(--rule) 0.75px, transparent 1px) 0 0 / 14px 14px,
    radial-gradient(ellipse at center, var(--band), var(--bg) 76%);
}

.instrument-svg {
  display: block;
  width: 100%;
  min-width: 560px;
  height: auto;
}

.astrolabe-card {
  margin-bottom: 12px;
}

.astrolabe-stage {
  display: grid;
  place-items: center;
  padding: 10px;
}

.astrolabe-svg {
  display: block;
  width: min(100%, 310px);
  height: auto;
}

/* Shared SVG Primitive Classes */

.lv-grid {
  fill: none;
  stroke: var(--rule);
  stroke-width: 1;
}

.lv-orbit {
  fill: none;
  stroke: var(--control-rule);
  stroke-width: 1;
  stroke-dasharray: 3 4;
}

.lv-muted-line {
  fill: none;
  stroke: var(--control-rule);
  stroke-linecap: round;
}

.lv-accent {
  fill: none;
  stroke: var(--accent);
  stroke-linecap: round;
}

.lv-source {
  fill: none;
  stroke: var(--graph-source);
  stroke-linecap: round;
}

.lv-task {
  fill: none;
  stroke: var(--graph-task);
  stroke-linecap: round;
}

.lv-green {
  fill: none;
  stroke: var(--green);
  stroke-linecap: round;
}

.lv-warn {
  fill: none;
  stroke: var(--yellow);
  stroke-linecap: round;
}

.lv-red {
  fill: none;
  stroke: var(--red);
  stroke-linecap: round;
}

.lv-panel {
  fill: var(--panel);
  stroke: var(--control-rule);
  stroke-width: 1;
}

.lv-node-plate {
  fill: var(--panel);
  stroke: var(--control-rule);
  stroke-width: 1.5;
}

.lv-hub {
  fill: var(--band);
  stroke: var(--accent);
  stroke-width: 1.6;
}

.lv-fill-accent {
  fill: var(--accent);
}

.lv-fill-source {
  fill: var(--graph-source);
}

.lv-fill-task {
  fill: var(--graph-task);
}

.lv-fill-warn {
  fill: var(--yellow);
}

.lv-fill-muted {
  fill: var(--control-rule);
}

.lv-dot-accent {
  fill: var(--accent);
  stroke: var(--bg);
  stroke-width: 1.5;
}

.lv-dot-source {
  fill: var(--graph-source);
  stroke: var(--bg);
  stroke-width: 1.5;
}

.lv-dot-task {
  fill: var(--graph-task);
  stroke: var(--bg);
  stroke-width: 1.5;
}

.lv-dot-green {
  fill: var(--green);
  stroke: var(--bg);
  stroke-width: 1.5;
}

.lv-dot-warn {
  fill: var(--yellow);
  stroke: var(--bg);
  stroke-width: 1.5;
}

.lv-dot-red {
  fill: var(--red);
  stroke: var(--bg);
  stroke-width: 1.5;
}

.lv-lambda {
  fill: var(--accent);
  font: 600 13px var(--display);
  text-anchor: middle;
}

.lv-lambda-lg {
  fill: var(--text);
  font: 600 22px var(--display);
  text-anchor: middle;
}

.lv-axis {
  fill: var(--dim);
  font: 600 10.5px var(--mono);
  letter-spacing: 0.05em;
}

.lv-caption {
  fill: var(--text);
  font: 550 12px var(--sans);
}

.lv-segment-label {
  fill: var(--sub);
  font: 500 11px var(--mono);
}

.lv-node-code {
  fill: var(--text);
  font: 600 10.5px var(--mono);
  text-anchor: middle;
}

.strata-node,
.astrolabe-quadrant,
.chrono-node {
  cursor: pointer;
}

.strata-node:focus-visible,
.astrolabe-quadrant:focus-visible,
.chrono-node:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* Workbench & Sections */

.preview-content {
  min-height: 140px;
}

.preview-workbench {
  display: grid;
  grid-template-columns: minmax(270px, 0.85fr) minmax(0, 1.3fr);
  border: 1px solid var(--rule);
  border-radius: var(--radius-panel);
  background: var(--sheet);
  box-shadow:
    inset 0 1px var(--rim),
    0 8px 22px var(--shadow);
  overflow: hidden;
}

.preview-workbench.graph-bench {
  grid-template-columns: minmax(0, 1.75fr) minmax(260px, 0.85fr);
}

.preview-workbench.preflight-bench {
  grid-template-columns: minmax(0, 1.18fr) minmax(280px, 0.92fr);
}

.preview-section {
  min-width: 0;
  padding: clamp(14px, 1.7vw, 24px);
  overflow-wrap: anywhere;
}

.preview-workbench > .preview-section + .preview-section {
  border-inline-start: 1px solid var(--rule);
  background: var(--panel);
}

.preview-section-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 8px 14px;
  margin-bottom: 14px;
}

.section-eyebrow {
  margin-bottom: 3px;
  color: var(--dim);
  font: 600 11px / 1.3 var(--mono);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.preview-section h2 {
  font-size: 20px;
  font-weight: 620;
  line-height: 1.2;
}

.lab-count {
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--bg);
  color: var(--sub);
  font: 550 12px / 1.3 var(--mono);
  white-space: nowrap;
}

.preview-detail-title {
  margin-block: 4px 8px;
  color: var(--text);
  font: 540 24px / 1.16 var(--display);
}

.dossier-header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 12px;
}

.dossier-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-block: 8px;
}

.dossier-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 8px;
  margin-block: 10px 14px;
  padding: 10px;
  border: 1px solid var(--rule);
  border-radius: 9px;
  background: var(--bg);
}

.dossier-meta dt {
  color: var(--dim);
  font-size: var(--type-meta);
}

.dossier-meta dd {
  margin: 2px 0 0;
  color: var(--text);
  font-size: var(--type-label);
  font-weight: 560;
}

.editorial-statement {
  margin: 12px 0;
  padding: 4px 0 4px 14px;
  border-inline-start: 2px solid var(--accent);
  color: var(--text);
  font: 480 clamp(17px, 1.35vw, 20px) / 1.42 var(--sans);
}

.lab-comparison-frame {
  margin-block: 12px;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--bg);
}

/* Chips & Badges */

.lab-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.lab-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--bg);
  color: var(--sub);
  font-size: var(--type-meta);
  font-weight: 540;
}

.lab-chip.mono {
  font-family: var(--mono);
}

.lab-chip.accent {
  border-color: var(--accent);
  background: var(--soft);
  color: var(--accent);
}

.lab-chip.ok {
  border-color: color-mix(in srgb, var(--green) 48%, var(--rule));
  color: var(--green);
}

.lab-chip.warn {
  border-color: color-mix(in srgb, var(--yellow) 48%, var(--rule));
  color: var(--yellow);
}

.lab-chip.error {
  border-color: color-mix(in srgb, var(--red) 48%, var(--rule));
  color: var(--red);
}

.lab-row-badge {
  flex: none;
  padding: 2px 7px;
  border: 1px solid var(--rule);
  border-radius: 5px;
  background: var(--bg);
  color: var(--sub);
  font: 550 11px / 1.3 var(--mono);
}

/* Controls, Inputs, Lists */

.preview-muted,
.preview-message,
.preview-warning {
  margin-block: 8px;
  color: var(--sub);
  font-size: var(--type-label);
}

.preview-warning {
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-inline-start: 3px solid var(--yellow);
  border-radius: 8px;
  background: var(--bg);
  color: var(--yellow);
}

.preview-message:empty {
  margin: 0;
}

.preview-input {
  display: grid;
  gap: 5px;
  max-width: 100%;
  color: var(--sub);
  font-size: var(--type-label);
}

.preview-input input:not([type="range"]),
.preview-input select {
  min-width: 0;
  min-height: 38px;
  padding: 6px 10px;
  border: 1px solid var(--control-rule);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
}

.preview-input input[type="range"] {
  width: 100%;
  margin: 4px 0;
}

.preview-input .budget-label {
  margin-inline-start: 6px;
  color: var(--accent);
  font-family: var(--mono);
}

.preview-list {
  margin-block: 12px;
}

.preview-list > li + li {
  border-top: 1px solid var(--rule);
}

.preview-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  padding: 9px 11px;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--text);
  text-align: start;
}

.preview-row:hover {
  background: var(--raised);
}

.preview-row[aria-current="true"] {
  border-color: var(--rule);
  border-inline-start: 3px solid var(--accent);
  background: var(--soft);
}

.preview-row-copy {
  min-width: 0;
  flex: 1;
}

.preview-row small {
  display: block;
  margin-top: 2px;
  color: var(--sub);
  font-size: var(--type-meta);
}

.preview-row .visual-icon {
  flex: none;
  color: var(--dim);
}

.preview-switch {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-block: 8px 12px;
}

.preview-switch button,
.pill-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 4px 10px;
  border: 1px solid var(--rule);
  border-radius: 7px;
  background: var(--bg);
  color: var(--sub);
  font-size: var(--type-label);
  font-weight: 540;
}

.preview-switch button:hover,
.preview-switch [aria-pressed="true"],
.pill-toggle:hover,
.pill-toggle[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--soft);
  color: var(--text);
}

.kind-marker {
  display: inline-block;
  width: 9px;
  height: 9px;
  background: var(--accent);
}

.kind-marker[data-kind="Decisão"] {
  transform: rotate(45deg);
  background: var(--accent);
}

.kind-marker[data-kind="Fonte"] {
  border-radius: 2px;
  background: var(--graph-source);
}

.kind-marker[data-kind="Tarefa"] {
  border-radius: 999px;
  background: var(--graph-task);
}

/* Evidence Card */

.preview-evidence {
  margin: 14px 0;
  padding: 12px 14px;
  border: 1px solid var(--rule);
  border-inline-start: 3px solid var(--accent);
  border-radius: 9px;
  background: var(--bg);
}

.preview-evidence[data-kind="Código"] {
  border-inline-start-color: var(--graph-task);
}

.preview-evidence[data-kind="Documento"] {
  border-inline-start-color: var(--graph-source);
}

.preview-evidence figcaption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 10px;
  color: var(--sub);
  font-size: var(--type-meta);
}

.evidence-path {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
}

.evidence-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.preview-evidence blockquote {
  margin: 9px 0 0;
  color: var(--text);
  font-size: var(--type-label);
}

/* Related Pills */

.preview-related {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
}

.related-label {
  color: var(--dim);
  font: 600 11px / 1.2 var(--mono);
  text-transform: uppercase;
}

.related-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.related-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 4px 10px;
  border: 1px solid var(--control-rule);
  border-radius: 999px;
  background: var(--bg);
  color: var(--accent);
  font-size: var(--type-meta);
  font-weight: 600;
}

.related-pill:hover {
  border-color: var(--accent);
  background: var(--soft);
}

/* KGraph SVG Canvas */

.graph-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 14px;
  margin-bottom: 10px;
}

.graph-controls .preview-switch {
  margin: 0;
}

.graph-viewport {
  overflow: auto;
  margin-block: 8px;
  background:
    radial-gradient(circle, var(--rule) 0.75px, transparent 1px) 0 0 / 14px 14px,
    radial-gradient(ellipse at center, var(--band), var(--bg) 74%);
  border: 1px solid var(--rule);
  border-radius: 11px;
}

.knowledge-graph {
  display: block;
  width: 100%;
  min-width: 560px;
}

.graph-node,
.graph-edge,
.graph-edge-group {
  --node-tone: var(--accent);
}

.graph-node[data-kind="Fonte"],
.graph-edge[data-kind="Fonte"] {
  --node-tone: var(--graph-source);
}

.graph-node[data-kind="Tarefa"],
.graph-edge[data-kind="Tarefa"] {
  --node-tone: var(--graph-task);
}

.graph-edge-group[data-dimmed="true"],
.graph-node[data-dimmed="true"] {
  opacity: 0.25;
}

.graph-edge {
  fill: none;
  stroke: color-mix(in srgb, var(--node-tone) 38%, var(--rule));
  stroke-width: 1.4;
}

.graph-edge[data-connected="true"] {
  stroke: var(--node-tone);
  stroke-width: 2.2;
}

@media (prefers-reduced-motion: no-preference) {
  .graph-edge[data-connected="true"] {
    stroke-dasharray: 6 4;
    animation: edge-flow 16s linear infinite;
  }
  [data-motion-paused="true"] .graph-edge[data-connected="true"] {
    animation-play-state: paused;
  }
}

@keyframes edge-flow {
  to {
    stroke-dashoffset: -120;
  }
}

.edge-pill {
  fill: var(--bg);
  stroke: var(--rule);
  stroke-width: 1;
}

.edge-pill-text {
  fill: var(--sub);
  font: 550 10.5px var(--sans);
  text-anchor: middle;
}

.graph-node {
  cursor: pointer;
}

.graph-node rect,
.graph-node polygon {
  fill: var(--panel);
  stroke: color-mix(in srgb, var(--node-tone) 60%, var(--control-rule));
  stroke-width: 1.3;
}

.graph-glyph {
  fill: var(--node-tone);
  font: 600 15px var(--display);
  text-anchor: middle;
  pointer-events: none;
}

.graph-glyph-mark {
  fill: var(--node-tone);
  pointer-events: none;
}

.graph-title {
  fill: var(--text);
  font: 600 12.5px var(--sans);
  pointer-events: none;
}

.graph-sub {
  fill: var(--dim);
  font: 500 10px var(--mono);
  pointer-events: none;
}

.graph-node:hover rect,
.graph-node:hover polygon,
.graph-node[aria-pressed="true"] rect,
.graph-node[aria-pressed="true"] polygon,
.graph-node:focus-visible rect,
.graph-node:focus-visible polygon {
  fill: color-mix(in srgb, var(--panel), var(--node-tone) 15%);
  stroke: var(--node-tone);
  stroke-width: 2.2;
}

.graph-node:focus-visible {
  outline: 2px solid var(--focus);
}

.graph-relations li + li {
  border-top: 1px solid var(--rule);
}

/* Checklists, Compiler, Telemetry, Conflict Desk, Arena & Replay */

.preview-checks,
.arena-selection {
  min-inline-size: 0;
  margin: 10px 0;
  padding: 6px 10px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--bg);
}

.preview-checks legend,
.arena-selection legend {
  padding-inline: 6px;
  color: var(--sub);
  font-size: var(--type-label);
}

.preview-checks label {
  display: flex;
  align-items: start;
  gap: 10px;
  min-height: 52px;
  padding: 8px 6px;
  border-radius: 7px;
  cursor: pointer;
}

.preview-checks label + label {
  border-top: 1px solid var(--rule);
}

.preview-checks label:hover,
.preview-control:hover {
  background: var(--raised);
}

.check-copy {
  display: grid;
  gap: 3px;
  min-width: 0;
  flex: 1;
}

.check-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
}

.preview-checks small {
  color: var(--sub);
  font-size: var(--type-meta);
}

.step-code {
  display: inline-grid;
  place-items: center;
  min-width: 24px;
  height: 20px;
  padding-inline: 4px;
  border: 1px solid var(--rule);
  border-radius: 5px;
  background: var(--panel);
  color: var(--accent);
  font: 600 11px var(--mono);
}

.budget-presets {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-block: 10px;
}

.preview-number {
  margin-block: 4px 8px;
  font: 540 32px / 1.15 var(--display);
}

.preview-number small {
  font: 450 var(--type-ui) / 1.4 var(--sans);
  color: var(--sub);
}

.budget-progress {
  width: 100%;
  height: 11px;
  accent-color: var(--accent);
}

.manifest-list {
  display: grid;
  gap: 8px;
  margin-block: 12px;
}

.manifest-list li {
  padding: 9px 11px;
  border: 1px solid var(--rule);
  border-inline-start: 3px solid var(--green);
  border-radius: 8px;
  background: var(--bg);
}

.manifest-list li.omitted {
  border-inline-start-color: var(--yellow);
  opacity: 0.85;
}

.manifest-item-head,
.manifest-item-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
}

.manifest-item-meta {
  margin-top: 4px;
  color: var(--sub);
  font-size: var(--type-meta);
}

.preview-disclosure {
  margin-block: 12px;
}

.preview-disclosure summary {
  width: fit-content;
  cursor: pointer;
  color: var(--accent);
  font-size: var(--type-label);
  font-weight: 560;
}

.preview-code {
  max-width: 100%;
  margin-block: 8px;
  padding: 12px;
  overflow: auto;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--bg);
  font: 12.5px / 1.55 var(--mono);
}

.preview-control {
  display: flex;
  align-items: start;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: 9px;
  background: var(--bg);
  cursor: pointer;
}

.preview-control small {
  display: block;
  margin-top: 2px;
  color: var(--sub);
  font-size: var(--type-meta);
}

.lab-action-row {
  margin-block: 12px;
}

.telemetry-timeline {
  display: grid;
  gap: 0;
  margin: 12px 0;
  padding-inline-start: 14px;
  border-inline-start: 2px solid var(--rule);
  list-style: none;
}

.telemetry-timeline li {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 10px;
  padding: 6px 0;
}

.telemetry-timeline li::before {
  content: "";
  position: absolute;
  inset-inline-start: -19px;
  top: 12px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  border: 1.5px solid var(--panel);
}

.telemetry-timeline li[data-tone="warn"]::before {
  background: var(--yellow);
}

.telemetry-timeline li[data-tone="block"]::before {
  background: var(--red);
}

.telemetry-timeline time {
  color: var(--dim);
  font-size: var(--type-meta);
}

.conflict-desk {
  margin-block: 12px;
  padding: 12px;
  border: 1px solid color-mix(in srgb, var(--yellow) 45%, var(--rule));
  border-radius: 10px;
  background: var(--bg);
}

.conflict-head {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  align-items: baseline;
  margin-bottom: 10px;
  color: var(--yellow);
  font-size: var(--type-label);
}

.conflict-columns {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
}

.conflict-card {
  padding: 10px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--sheet);
}

.conflict-card.incumbent {
  border-inline-start: 3px solid var(--graph-source);
}

.conflict-card.candidate {
  border-inline-start: 3px solid var(--yellow);
}

.conflict-card p {
  margin-top: 4px;
  font-size: var(--type-label);
}

.plan-dossier {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--rule);
  border-radius: 9px;
  background: var(--bg);
}

/* Arena */

.arena-selection {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 16px;
  padding: 10px 14px;
}

.arena-chip-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
}

.arena-branch-tag {
  padding: 1px 6px;
  border: 1px solid var(--rule);
  border-radius: 5px;
  color: var(--sub);
  font-size: 11px;
}

.arena-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(276px, 100%), 1fr));
  gap: 14px;
}

.arena-dossier {
  display: flex;
  flex-direction: column;
  gap: 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-panel);
  background: var(--sheet);
  box-shadow: inset 0 1px var(--rim);
}

.arena-dossier[data-chosen="true"] {
  border-color: var(--accent);
  background: linear-gradient(155deg, var(--band), var(--sheet) 70%);
}

.arena-patch {
  margin: 0;
  padding: 9px 11px;
  overflow-x: auto;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--bg);
  color: var(--sub);
  font: 12px / 1.45 var(--mono);
}

.arena-meters {
  display: grid;
  gap: 7px;
}

.meter-head {
  display: flex;
  justify-content: space-between;
  font-size: var(--type-meta);
  color: var(--sub);
}

.meter-track {
  height: 5px;
  margin-top: 3px;
  border-radius: 999px;
  background: var(--bg);
  overflow: hidden;
}

.meter-track > span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--graph-source), var(--accent));
}

.arena-facts div {
  padding: 7px 0;
  border-top: 1px solid var(--rule);
}

.arena-facts dt {
  color: var(--dim);
  font-size: var(--type-meta);
}

.arena-facts dd {
  margin: 2px 0 0;
  color: var(--text);
  font-size: var(--type-label);
}

/* Replay */

.replay-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 10px 12px;
  margin-bottom: 10px;
}

.replay-controls .preview-input {
  flex: 1 1 200px;
}

.replay-swap {
  min-height: 38px;
}

@media (prefers-reduced-motion: no-preference) {
  .graph-edge,
  .graph-node rect,
  .graph-node polygon {
    transition:
      stroke 140ms ease-out,
      fill 140ms ease-out,
      opacity 140ms ease-out;
  }
}

@container (max-width: 720px) {
  .preview-workbench,
  .preview-workbench.graph-bench,
  .preview-workbench.preflight-bench {
    grid-template-columns: minmax(0, 1fr);
  }
  .preview-workbench > .preview-section + .preview-section {
    border-inline-start: 0;
    border-top: 1px solid var(--rule);
  }
  .lab-masthead-copy {
    max-width: 100%;
  }
  .lab-masthead .spectral-field {
    opacity: 0.35;
  }
}

@media (forced-colors: active) {
  .preview-row[aria-current="true"],
  .rail-link[aria-current="page"],
  .lab-strip-item[aria-current="page"],
  .lab-specimen:hover,
  .arena-dossier[data-chosen="true"] {
    outline: 2px solid Highlight;
    outline-offset: -1px;
  }
  .lab-strip-item[aria-current="page"]::after {
    border-block-end-color: Highlight;
  }
}
