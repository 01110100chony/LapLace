:root {
  color-scheme: dark;
  --sans: Inter, "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --display: Fraunces, Georgia, serif;
  --mono: "JetBrains Mono", Consolas, "Liberation Mono", monospace;
  --type-display: clamp(34px, 4vw, 60px);
  --type-page: clamp(31px, 3.2vw, 46px);
  --type-body: 15px;
  --type-label: 14px;
  --type-meta: 12px;
  --type-ui: 14px;
  --type-panel: 19px;
  --type-section: 26px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --radius-control: 8px;
  --radius-panel: 13px;
  --bg: #121015;
  --side: #18141b;
  --panel: #201b23;
  --raised: #29222c;
  --text: #f4eee8;
  --sub: #c9bfc8;
  --dim: #a99eac;
  --rule: #3b323a;
  --control-rule: #716476;
  --accent: #ffad82;
  --accent-hover: #f7c2a6;
  --ink: #241710;
  --green: #a1ceb7;
  --yellow: #e9c58e;
  --red: #f2aaa7;
  --added-wash: #202c27;
  --removed-wash: #34242b;
  --soft: #2c2228;
  --focus: #f1b899;
  --seal: #eea781;
  --sheet: #1c1820;
  --band: #2b2025;
  --rim: #ffffff09;
  --shadow: #07050b35;
  --graph-source: #7ed4c5;
  --graph-task: #bdabf3;
}

:root[data-theme="Astra"] {
  --bg: #111822;
  --side: #151e2a;
  --panel: #1a2533;
  --raised: #243244;
  --text: #eef4f6;
  --sub: #bdcbd7;
  --dim: #9baebf;
  --rule: #334456;
  --control-rule: #62788d;
  --accent: #94d5e0;
  --accent-hover: #b7e7ec;
  --ink: #0d242c;
  --green: #a1d1ba;
  --yellow: #ecd096;
  --red: #ffb1bc;
  --added-wash: #1b3331;
  --removed-wash: #352933;
  --soft: #1d303c;
  --focus: #a7e3f0;
  --seal: #8cd8e8;
  --sheet: #15202d;
  --band: #1a2a3b;
  --rim: #e3f8ff0c;
  --shadow: #090d163a;
  --graph-source: #81d8c5;
  --graph-task: #c1b5f8;
}

:root[data-theme="Quartz"] {
  color-scheme: light;
  --bg: #f2eee6;
  --side: #e9e3d9;
  --panel: #faf7f0;
  --raised: #eee7dd;
  --text: #262322;
  --sub: #514a47;
  --dim: #635b56;
  --rule: #d6cdc0;
  --control-rule: #88776b;
  --accent: #88492f;
  --accent-hover: #753c26;
  --ink: #fff8ed;
  --green: #24634f;
  --yellow: #77531e;
  --red: #9c373e;
  --added-wash: #e3eee5;
  --removed-wash: #f3e4e2;
  --soft: #efe3d8;
  --focus: #804127;
  --seal: #965131;
  --sheet: #fbf8f1;
  --band: #eee6d9;
  --rim: #ffffff85;
  --shadow: #5b483111;
  --graph-source: #246b60;
  --graph-task: #69529b;
}


html {
  font: var(--type-body) / 1.5 var(--sans);
  scroll-padding-block-start: 64px;
  scrollbar-width: thin;
  scrollbar-color: var(--control-rule) transparent;
  scrollbar-gutter: stable;
  accent-color: var(--accent);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

button {
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

button:disabled,
button[aria-disabled="true"] {
  cursor: default;
  opacity: 0.55;
}

:where(button, a, input, select, textarea, summary):focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

:where(h1, h2, h3, p, ul, dl, dd) {
  margin: 0;
}

:where(ul) {
  padding: 0;
  list-style: none;
}

code,
time {
  font-family: var(--mono);
  font-size: 0.92em;
  font-variant-numeric: tabular-nums;
}

.visually-hidden,
.skip-link:not(:focus) {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.skip-link:focus {
  position: fixed;
  z-index: 3;
  inset: 8px auto auto 8px;
  padding: 8px 12px;
  background: var(--accent);
  color: var(--ink);
}

.frame {
  --sidebar-width: clamp(200px, 17.4vw, 252px);
  --titlebar-height: 56px;
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  grid-template-rows: var(--titlebar-height) 1fr;
  min-height: 100vh;
}

.visual-icon,
.lambda-mark {
  display: block;
  flex: none;
  inline-size: 1.2em;
  block-size: 1.2em;
}

.sidebar {
  position: sticky;
  top: var(--titlebar-height);
  display: flex;
  flex-direction: column;
  gap: 4px;
  height: calc(100vh - var(--titlebar-height));
  padding: 20px 14px;
  overflow: auto;
  border-right: 1px solid var(--rule);
  background: var(--side);
}

.brand {
  flex: 0 0 var(--sidebar-width);
  align-self: stretch;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-inline: 20px;
  border-right: 1px solid var(--rule);
  background: var(--side);
  color: var(--text);
  font: 550 26px/1 var(--display);
  letter-spacing: -0.04em;
}

.brand-mark {
  display: grid;
  place-items: center;
  color: var(--accent);
}

.brand-mark .lambda-mark {
  inline-size: 27px;
  block-size: 27px;
  pointer-events: none;
}

.nav-item {
  position: relative;
  width: 100%;
  min-height: 42px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 7px 11px;
  border: 1px solid transparent;
  border-radius: var(--radius-control);
  color: var(--sub);
  font-size: var(--type-ui);
  font-weight: 500;
  text-align: start;
}

.nav-item:hover:not(:disabled) {
  background: var(--raised);
  color: var(--text);
}

.nav-item[aria-current="page"] {
  border-color: var(--rule);
  background: var(--soft);
  color: var(--text);
  font-weight: 620;
}

.nav-item[aria-current="page"]::before {
  position: absolute;
  inset-block: 10px;
  inset-inline-start: -1px;
  width: 2px;
  border-radius: 2px;
  background: var(--accent);
  content: "";
}

.nav-item .visual-icon {
  inline-size: 20px;
  block-size: 20px;
  color: var(--dim);
}

.nav-item[aria-current="page"] .visual-icon {
  color: var(--accent);
}

.nav-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-group {
  margin: 20px 12px 4px;
  color: var(--dim);
  font-size: var(--type-label);
  font-weight: 600;
}

.nav-empty {
  margin: 4px 12px;
  color: var(--dim);
  font-size: var(--type-label);
}

.nav-list {
  display: grid;
  gap: 2px;
}

.nav-list li {
  min-width: 0;
}

.nav-add {
  margin-top: var(--space-2);
  color: var(--dim);
}

.app-titlebar {
  position: sticky;
  top: 0;
  z-index: 2;
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  height: var(--titlebar-height);
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  color: var(--sub);
  font-size: var(--type-label);
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  margin-left: clamp(24px, 2.8vw, 44px);
}

.breadcrumb strong {
  min-width: 0;
  max-width: 42ch;
  overflow: hidden;
  color: var(--text);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.breadcrumb-separator {
  color: var(--dim);
}

.crumb-back {
  display: none;
}

.crumb-action {
  flex: none;
  min-height: 32px;
  padding: 0;
}

.crumb-action:hover,
.text-button:hover {
  text-decoration: underline;
}

.window-drag-region {
  align-self: stretch;
  flex: 1 0 16px;
}

.app-titlebar [data-tauri-drag-region] {
  user-select: none;
}

.appearance-controls {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-inline: 8px 12px;
}

.theme-select,
.motion-button {
  min-height: 36px;
  border: 1px solid var(--control-rule);
  border-radius: var(--radius-control);
  background: var(--panel);
  color: var(--text);
  font: 550 var(--type-ui) / 1 var(--sans);
}

.theme-select {
  padding-inline: 10px 6px;
  cursor: pointer;
}

.motion-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 38px;
  padding-inline: 8px 10px;
  color: var(--sub);
}

.motion-button[aria-pressed="true"] {
  background: var(--soft);
  color: var(--accent);
}

.theme-select:hover,
.motion-button:hover {
  background: var(--raised);
}

.window-controls {
  display: flex;
  align-self: stretch;
}

.window-control {
  display: grid;
  place-items: center;
  width: 46px;
  padding: 0;
  color: var(--sub);
}

.window-control svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.15;
  pointer-events: none;
}

.window-control:hover,
.window-control:active {
  background: var(--raised);
  color: var(--text);
}

.window-close:hover,
.window-close:active {
  background: #a73530;
  color: #fff;
}

.window-control:focus-visible {
  outline-offset: -4px;
}

.main {
  max-width: 1640px;
  margin: 0 auto;
  padding: 24px clamp(24px, 2.8vw, 44px) 40px;
  container-type: inline-size;
}

.main:focus {
  outline: none;
}

.headline {
  margin-bottom: 24px;
  border-bottom: 1px solid var(--rule);
}

.spectral-heading {
  display: grid;
  grid-template-columns: minmax(0, 0.96fr) minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  min-height: 212px;
}

.headline-copy {
  padding-block: 12px 24px;
}

.label {
  margin-bottom: 6px;
  color: var(--accent);
  font-size: var(--type-label);
  font-weight: 600;
}

h1 {
  overflow-wrap: anywhere;
  font: 560 var(--type-display) / 1.05 var(--display);
  letter-spacing: -0.038em;
}

.headline-description,
.project-path {
  margin-top: 12px;
  color: var(--sub);
  overflow-wrap: anywhere;
}

.spectral-field {
  position: relative;
  height: clamp(156px, 15vw, 230px);
  overflow: hidden;
}

.spectral-field canvas {
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.spectral-seal {
  position: absolute;
  top: 47%;
  right: 4%;
  display: grid;
  place-items: center;
  width: clamp(48px, 6.2vw, 94px);
  aspect-ratio: 1;
  transform: translateY(-50%);
  color: var(--seal);
  pointer-events: none;
}

.spectral-seal::before {
  position: absolute;
  inset: 0;
  border: 1px solid currentColor;
  border-radius: 50%;
  opacity: 0.38;
  content: "";
}

.spectral-seal .lambda-mark {
  width: 52%;
  height: 52%;
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 7px 12px;
  border: 1px solid var(--control-rule);
  border-radius: var(--radius-control);
  background: var(--panel);
  color: var(--text);
  font-size: var(--type-ui);
  font-weight: 550;
  text-align: center;
}

.button:hover:not(:disabled, [aria-disabled="true"]),
.icon-button:hover,
.project-row:hover {
  background: var(--raised);
  color: var(--text);
}

.button.primary {
  padding-inline: 14px;
  border-color: var(--accent);
  background: var(--accent);
  color: var(--ink);
  font-weight: 650;
}

.button.primary:hover:not(:disabled, [aria-disabled="true"]) {
  border-color: var(--accent-hover);
  background: var(--accent-hover);
  color: var(--ink);
}

.body-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(220px, 0.39fr);
  align-items: start;
  gap: 20px;
}

.workspace-projects {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 24px;
  min-width: 0;
}

.panel.resume-project {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  border-color: var(--control-rule);
  background: var(--soft);
}

.resume-project-copy {
  flex: 1 1 250px;
  min-width: 0;
  overflow-wrap: anywhere;
}

.resume-project h2 {
  font: 555 clamp(24px, 2.5vw, 36px) / 1.12 var(--display);
  letter-spacing: -0.026em;
}

.resume-project-detail {
  margin-top: 8px;
  color: var(--sub);
  font-size: var(--type-ui);
}

.section-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 16px;
  margin-bottom: 12px;
}

.projects h2 {
  font: 550 var(--type-section) / 1.12 var(--display);
  letter-spacing: -0.025em;
}

:where(.panel) h2 {
  font-size: var(--type-panel);
  font-weight: 620;
  line-height: 1.25;
}

.section-heading > span,
.empty,
.observed {
  color: var(--dim);
  font-size: var(--type-label);
}

.project-list,
.empty {
  border: 1px solid var(--rule);
  border-radius: var(--radius-panel);
  background: var(--panel);
}

.empty {
  padding: 16px;
}

.project-list li + li {
  border-top: 1px solid var(--rule);
}

.project-list li:first-child .project-row {
  border-start-start-radius: var(--radius-panel);
  border-start-end-radius: var(--radius-panel);
}

.project-list li:last-child .project-row {
  border-end-start-radius: var(--radius-panel);
  border-end-end-radius: var(--radius-panel);
}

.project-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  text-align: start;
}

.project-row:focus-visible {
  outline-offset: -3px;
}

.project-icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-control);
  background: var(--raised);
  color: var(--accent);
}

.project-row-name {
  flex: 1;
  min-width: 0;
}

.project-row-name strong,
.project-row-name small,
.project-branch small,
.project-branch code {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.project-row-name strong {
  font-weight: 620;
}

.project-row small {
  color: var(--dim);
  font-size: var(--type-label);
}

.project-branch {
  max-width: 35%;
  color: var(--sub);
  text-align: end;
}

.project-row > .visual-icon {
  color: var(--accent);
}

.service-details {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
}

.service-label {
  font-weight: 550;
}

.signal,
.clean,
.loading {
  display: flex;
  align-items: center;
  gap: 8px;
}

.signal {
  margin-top: 4px;
  color: var(--green);
  font-size: var(--type-ui);
}

.signal.loading {
  color: var(--yellow);
}

.signal.error,
.service-error {
  color: var(--red);
}

.status-dot,
.loading > span {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.service-versions,
.service-error {
  margin-top: 12px;
  font-size: var(--type-ui);
}

.service-versions > div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.service-versions,
.loading {
  color: var(--sub);
}

.text-button {
  min-height: 36px;
  padding: 0;
  color: var(--accent);
  font-size: var(--type-ui);
  font-weight: 600;
}

.project-headline {
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.95fr);
  min-height: 140px;
  margin-bottom: var(--space-2);
  border-bottom: 0;
}

.project-headline .headline-copy {
  padding-block: var(--space-2);
}

.project-headline h1 {
  font-size: var(--type-page);
}

.project-headline .project-path {
  margin-top: var(--space-2);
  max-inline-size: 80ch;
  font-size: var(--type-ui);
}

.project-path > summary {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: fit-content;
  max-width: 100%;
  min-height: 32px;
  list-style: none;
  cursor: pointer;
}

.project-path > summary::-webkit-details-marker {
  display: none;
}

.project-path > summary code {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.project-path > summary:hover,
.project-path[open] > summary {
  color: var(--text);
}

.project-path > summary .visual-icon:last-child {
  width: 14px;
  height: 14px;
}

.project-path[open] > summary .visual-icon:last-child {
  transform: rotate(90deg);
}

.project-path-full {
  display: block;
  padding: var(--space-2);
  overflow-wrap: anywhere;
  border: 1px solid var(--rule);
  border-radius: var(--radius-control);
  background: var(--panel);
  user-select: text;
}

.project-headline .spectral-field {
  height: clamp(112px, 10vw, 156px);
}

.project-headline .spectral-seal {
  width: clamp(44px, 4.7vw, 70px);
}

.project-toolbar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0 var(--space-2);
  margin-bottom: var(--space-4);
  border-bottom: 1px solid var(--rule);
}

.project-sections {
  display: flex;
  flex-wrap: wrap;
  gap: 0 var(--space-1);
}

.project-section {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: var(--space-2) var(--space-3);
  border-bottom: 2px solid transparent;
  color: var(--sub);
  font-size: var(--type-ui);
  font-weight: 550;
}

.project-section .visual-icon {
  width: 18px;
  height: 18px;
  color: var(--dim);
}

.project-section:hover {
  background: var(--panel);
  color: var(--text);
}

.project-section[aria-current="page"] {
  border-color: var(--accent);
  color: var(--text);
  font-weight: 650;
}

.project-section[aria-current="page"] .visual-icon {
  color: var(--accent);
}

.project-section:focus-visible {
  outline-offset: -3px;
}

.project-refresh {
  min-height: 34px;
  margin: 0 0 var(--space-1) auto;
  padding-block: 4px;
}

:where(.context-result, .context-search) h3 {
  margin: 0;
  font-size: var(--type-panel);
  line-height: 1.25;
}

.context-toolbar,
.context-form {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
  overflow-wrap: anywhere;
}

.context-form label {
  flex-basis: 100%;
  color: var(--sub);
  font-size: var(--type-ui);
}

:is(.context-form, .work-field) :is(input, select) {
  min-width: 0;
  flex: 1;
  padding: 7px 9px;
  border: 1px solid var(--control-rule);
  border-radius: var(--radius-control);
  background: var(--bg);
  color: var(--text);
  font: inherit;
}

.context-files {
  min-inline-size: 0;
  max-height: 14rem;
  overflow: auto;
  margin: 12px 0 0;
  padding: 4px 8px 8px;
  border: 1px solid var(--rule);
  border-radius: 4px;
}

.context-files legend {
  padding: 0 5px;
  color: var(--sub);
  font-size: var(--type-label);
}

.context-file {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 4px 5px;
  text-align: start;
  overflow-wrap: anywhere;
}

.context-file input {
  margin: 0;
  accent-color: var(--accent);
}

.context-file:focus-within,
.context-form :is(input, select):focus-visible,
.context-result summary:focus-visible,
.context-selection summary:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -2px;
}

.context-selection {
  margin: 12px 0;
}

:where(.context-selection, .context-result) summary {
  width: fit-content;
  cursor: pointer;
  color: var(--accent);
}

.context-list {
  margin-top: 8px;
}

.context-history-row {
  display: grid;
  gap: 2px;
  width: 100%;
  padding: 8px;
  border-bottom: 1px solid var(--rule);
  text-align: start;
}

.context-history-row:hover,
.context-history-row[aria-current="true"] {
  background: var(--raised);
}

.context-history-row small,
.context-entries p {
  color: var(--sub);
}

.context-result .section-heading {
  flex-wrap: wrap;
  gap: 8px;
}

.codex-history-item {
  max-width: 100%;
  text-align: start;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.task-result h4 {
  margin: 12px 0 0;
}

.working-diff h4 {
  margin: 12px 0 0;
  overflow-wrap: anywhere;
}

.working-diff [aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
}

.text-diff {
  max-height: 18rem;
  overflow: auto;
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--bg);
  font-family: var(--mono);
}

.text-diff:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.diff-location {
  color: var(--sub);
}
.diff-added {
  color: var(--green);
  background: var(--added-wash);
}
.diff-removed {
  color: var(--red);
  background: var(--removed-wash);
}
.diff-versions {
  margin: 8px 0;
}

.context-search {
  margin-bottom: 14px;
  min-width: 0;
  overflow-wrap: anywhere;
}

.context-search-results > li {
  border-top: 1px solid var(--rule);
  padding-top: 10px;
}

.context-search h4 {
  margin: 0;
}

.context-search pre,
.codex-message {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 11rem;
  overflow: auto;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 6px;
  line-height: 1.45;
}

.context-entries > li {
  padding: 9px 0;
  border-top: 1px solid var(--rule);
  overflow-wrap: anywhere;
}

.context-entries details {
  margin-top: 4px;
}

:is(.codex-form, .task-fields) {
  display: grid;
  gap: 10px;
  min-inline-size: 0;
  border: 1px solid var(--rule);
  border-radius: var(--radius-control);
}

fieldset:is(.codex-form, .task-fields) {
  margin-inline: 0;
  padding: 12px 16px 16px;
}

.import-dialog form.task-fields {
  border: 0;
}

:is(.codex-form, .task-fields, .cockpit-field) > label,
.cockpit-field > span,
.task-fields legend {
  color: var(--sub);
  font-size: var(--type-ui);
  font-weight: 550;
}

.codex-form textarea,
.task-fields :is(input, textarea) {
  resize: vertical;
  padding: 8px 10px;
  border: 1px solid var(--control-rule);
  border-radius: var(--radius-control);
  background: var(--bg);
  color: var(--text);
  font: inherit;
}

.codex-form textarea:focus-visible,
.task-fields :is(input, textarea):focus-visible {
  outline: 2px solid var(--focus);
}

.task-form {
  margin-bottom: 16px;
}

.project-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.panel {
  min-width: 0;
  padding: var(--space-5);
  border: 1px solid var(--rule);
  border-radius: var(--radius-panel);
  background: var(--panel);
  overflow-wrap: anywhere;
}

.repo-info,
.change-counts {
  margin-top: 12px;
}

:where(.repo-info, .change-counts) > div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--rule);
}

:where(.repo-info, .change-counts) dt {
  color: var(--sub);
  font-size: var(--type-ui);
}

.repo-info dd {
  min-width: 0;
  overflow-wrap: anywhere;
  text-align: end;
}

.change-counts dd {
  font-family: var(--mono);
}

.clean,
.observed {
  margin-top: 14px;
}

.inspection-status {
  margin-bottom: var(--space-3);
  padding: var(--space-2) var(--space-3);
}

.clean {
  color: var(--green);
  font-size: var(--type-label);
}

.error-banner {
  margin-bottom: 14px;
  padding: 12px 16px;
  border-left: 2px solid var(--red);
  border-radius: 4px;
  background: var(--panel);
  color: var(--red);
}

.error-banner .text-button {
  display: block;
  margin-top: 4px;
}

.import-dialog {
  width: min(480px, calc(100% - 32px));
  max-height: calc(100% - 32px);
  padding: 22px;
  overflow: auto;
  overscroll-behavior: contain;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
}

.import-dialog::backdrop {
  background: #090a0bbb;
}

.dialog-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.dialog-heading h2 {
  font-size: 19px;
  font-weight: 620;
}

.icon-button {
  display: grid;
  place-items: center;
  flex: none;
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: var(--radius-control);
  color: var(--sub);
}

.import-dialog > p {
  color: var(--sub);
}

.import-dialog .dialog-error {
  margin-top: 12px;
  color: var(--red);
}

.import-dialog .loading {
  margin-top: 12px;
}

.dialog-actions {
  display: flex;
  justify-content: end;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}

@media (max-width: 1040px) {
  .body-grid {
    grid-template-columns: minmax(0, 1fr) minmax(194px, 0.43fr);
    gap: 16px;
  }
}

@media (max-width: 850px) {
  .frame {
    --sidebar-width: 178px;
  }

  .sidebar {
    padding-inline: 10px;
  }

  .body-grid,
  .project-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .motion-button {
    padding: 0;
  }

  .motion-button span {
    display: none;
  }

  .window-control {
    width: 38px;
  }
}

@media (max-width: 680px) {
  .frame {
    display: block;
    --titlebar-height: 52px;
  }

  .sidebar {
    position: static;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    height: auto;
    padding: 8px 16px 12px;
    border-right: 0;
    border-bottom: 1px solid var(--rule);
  }

  .sidebar > .nav-item {
    width: fit-content;
  }

  .nav-group {
    margin: 8px 12px 0;
  }

  .nav-group,
  .nav-empty,
  .nav-list {
    grid-column: 1 / -1;
  }

  .nav-list {
    display: flex;
    padding: 4px;
    margin-inline: -4px;
    overflow: auto;
  }

  .nav-list li {
    max-width: 12em;
    flex: none;
  }

  .nav-list .nav-item {
    min-height: 36px;
  }

  .nav-add {
    grid-area: 1 / 2;
    justify-self: end;
    margin-top: 0;
  }

  .brand {
    flex-basis: auto;
    gap: 5px;
    padding-inline: 12px;
    font-size: 22px;
  }

  .brand-mark .lambda-mark {
    width: 22px;
    height: 22px;
  }

  .breadcrumb {
    margin-left: 12px;
  }

  .main {
    padding-inline: 16px;
  }

  .spectral-heading {
    grid-template-columns: 1fr;
    gap: 0;
    min-height: 0;
  }

  .headline-copy {
    padding-block: 0 4px;
  }

  .spectral-field {
    height: 110px;
  }

  .project-headline {
    grid-template-columns: minmax(0, 1.35fr) minmax(88px, 0.78fr);
    gap: var(--space-2);
    min-height: 104px;
  }

  .project-headline .spectral-field {
    height: 100px;
  }
}

@media (max-width: 530px) {
  .appearance-controls {
    margin-inline: 0 4px;
    gap: 6px;
  }

  .breadcrumb {
    gap: 4px;
    margin-left: 6px;
  }

  .crumb-home-label,
  .breadcrumb-separator,
  .breadcrumb strong {
    display: none;
  }

  .crumb-back {
    display: grid;
    place-items: center;
    width: 28px;
  }

  .window-control {
    width: 34px;
  }

  .project-section {
    min-height: 40px;
    padding-inline: var(--space-2);
  }

  .project-section .visual-icon {
    display: none;
  }

  .project-refresh {
    min-width: 34px;
    padding-inline: 0;
  }

  .project-refresh span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .project-row {
    padding-inline: 12px;
  }
}

.workspace-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.clone-progress {
  display: block;
  inline-size: 100%;
}

.clone-path {
  overflow-wrap: anywhere;
}

.cockpit-stack {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}

.cockpit-header-meta,
.cockpit-actions,
.cockpit-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--rule);
  background: var(--raised);
  color: var(--sub);
  font-size: var(--type-label);
}

.badge.verified,
.badge.fresh {
  border-color: var(--green);
  color: var(--green);
}

.badge.cached,
.badge.warning,
.badge.unverified_legacy,
.badge.ambiguous {
  border-color: var(--yellow);
  color: var(--yellow);
}

.badge.advisory {
  background: var(--bg);
  color: var(--sub);
}

.badge.error,
.badge.divergent,
.badge.unavailable {
  border-color: var(--red);
  color: var(--red);
}

.cockpit-decision-body {
  padding: 12px;
  border-radius: 6px;
  border: 1px solid var(--rule);
  background: var(--raised);
  white-space: pre-wrap;
}

.cockpit-conflicts {
  display: grid;
  gap: 8px;
}

.cockpit-conflict-item {
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid var(--yellow);
  background: var(--soft);
}

.cockpit-conflict-item.blocking {
  border-color: var(--red);
}

.cockpit-form {
  display: grid;
  gap: 10px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
}

.cockpit-field {
  display: grid;
  gap: 4px;
}

.cockpit-field input,
.cockpit-field textarea,
.cockpit-field select {
  padding: 8px 10px;
  min-width: 0;
  border-radius: var(--radius-control);
  border: 1px solid var(--control-rule);
  background: var(--bg);
  color: var(--text);
  font: inherit;
}

.cockpit-check {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--sub);
}

.cockpit-evidence-box {
  display: grid;
  gap: 8px;
  margin-top: 10px;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid var(--rule);
  background: var(--bg);
}

.cockpit-excerpt {
  margin: 0;
  padding: 10px;
  border-radius: 4px;
  background: var(--side);
  font-family: var(--mono);
  font-size: 12px;
  overflow-x: auto;
}

.next-action-panel {
  border-inline-start: 2px solid var(--control-rule);
  padding-block: var(--space-3);
}

.next-action-panel .work-panel-heading {
  margin-bottom: 0;
}

.next-action-panel h3 {
  margin-top: var(--space-2);
  font-size: var(--type-body);
  font-weight: 620;
}

.next-action-panel > p {
  margin-top: var(--space-1);
}

.next-action-rationale {
  max-width: 64ch;
  color: var(--sub);
}

.next-action-panel .cockpit-conflicts {
  margin-top: 12px;
}

.decision-details {
  gap: var(--space-3);
}

.decision-details > .observed {
  margin-top: 0;
}

.checkout-details,
.checkout-counts {
  margin-top: var(--space-2);
}

.checkout-details > div {
  padding-block: var(--space-1);
}

.checkout-counts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(82px, 1fr));
  align-items: stretch;
  gap: var(--space-2);
  margin-top: var(--space-3);
}

.checkout-counts > div {
  flex-direction: column-reverse;
  justify-content: end;
  gap: 2px;
  padding: var(--space-2);
  border: 1px solid var(--rule);
  border-radius: var(--radius-control);
  background: var(--bg);
}

.checkout-counts dt {
  font-size: var(--type-meta);
  line-height: 1.3;
}

.checkout-counts dd {
  color: var(--text);
  font-size: 18px;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
}

.checkout-footer {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-1) var(--space-2);
  margin-top: var(--space-2);
}

.checkout-footer p {
  flex: 1 1 170px;
  margin: 0;
}

.text-button.decision-danger {
  color: var(--red);
}

.view-changes {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
}

.activity-list {
  margin-top: 16px;
  border-inline-start: 1px solid var(--control-rule);
}

.activity-list li {
  position: relative;
  padding-inline-start: 16px;
}

.activity-list li + li {
  margin-top: 16px;
}

.activity-list li::before {
  position: absolute;
  top: 9px;
  inset-inline-start: -4px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  content: "";
}

.activity-header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 16px;
}

.activity-header h3 {
  font-size: 15px;
  font-weight: 620;
}

.activity-header time,
.activity-list p {
  color: var(--sub);
}

.activity-list p,
.empty-activity {
  margin-top: 4px;
}

@media (forced-colors: active) {
  .nav-item[aria-current="page"],
  .project-section[aria-current="page"],
  .motion-button[aria-pressed="true"] {
    border-color: Highlight;
  }
}


.work-heading,
.work-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-4);
}

.work-heading {
  justify-content: space-between;
  margin-bottom: var(--space-4);
}

.work-heading h2 {
  font-size: var(--type-section);
  font-weight: 620;
  line-height: 1.2;
}

.work-heading p {
  margin-top: var(--space-1);
  color: var(--sub);
  font-size: var(--type-ui);
}

.work-actions {
  gap: var(--space-2);
}

.work-grid,
.work-stack {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-items: start;
  gap: var(--space-4);
}

@container (min-width: 690px) {
  .work-grid {
    grid-template-columns: minmax(0, 1fr) minmax(252px, 0.58fr);
  }

  .task-layout {
    grid-template-columns: minmax(240px, 0.64fr) minmax(0, 1fr);
  }

  .git-layout {
    grid-template-columns: minmax(340px, 0.8fr) minmax(0, 1fr);
  }
}

.empty-state {
  display: flex;
  align-items: start;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--rule);
  border-radius: var(--radius-control);
  background: var(--bg);
}

.empty-state-icon {
  display: grid;
  flex: none;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-control);
  background: var(--raised);
  color: var(--accent);
}

.empty-state-title {
  color: var(--text);
  font-weight: 600;
}

.empty-state-detail,
.work-muted,
.context-muted {
  color: var(--sub);
  font-size: var(--type-ui);
}

.empty-state-detail {
  margin-top: var(--space-1);
}

.work-message {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-3);
  margin-block: var(--space-2);
  color: var(--sub);
  font-size: var(--type-ui);
}

.work-message[role="alert"] {
  color: var(--red);
}

.work-message:empty {
  margin: 0;
}

.work-disclosure {
  padding: 0;
}

.work-disclosure > summary {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 48px;
  padding: var(--space-3) var(--space-4);
  list-style: none;
  cursor: pointer;
  border-radius: inherit;
}

.work-disclosure > summary::-webkit-details-marker {
  display: none;
}

.work-disclosure > summary:hover {
  background: var(--raised);
}

.work-disclosure > summary > .visual-icon {
  color: var(--accent);
}

.work-disclosure > summary small {
  display: block;
  margin-top: var(--space-1);
  color: var(--sub);
  font-size: var(--type-meta);
}

.disclosure-indicator {
  display: grid;
  place-items: center;
  margin-inline-start: auto;
  color: var(--dim);
}

.work-disclosure[open] > summary .disclosure-indicator {
  transform: rotate(90deg);
}

.work-disclosure-body {
  border-top: 1px solid var(--rule);
  padding: var(--space-4);
}

.work-list {
  display: grid;
  min-width: 0;
}

.work-list > li + li {
  border-top: 1px solid var(--rule);
}

.work-list-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 42px;
  width: 100%;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-control);
  text-align: start;
}

.work-list-row:hover:not(:disabled) {
  background: var(--raised);
}

.work-list-row[aria-current="true"] {
  box-shadow: inset 2px 0 0 var(--accent);
  background: var(--soft);
}

.work-list-row > .visual-icon {
  color: var(--accent);
}

.work-row-copy {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.work-row-copy > :is(strong, small) {
  display: block;
}

.work-row-copy strong {
  font-weight: 580;
}

.work-row-copy small {
  margin-top: 2px;
  color: var(--dim);
  font-size: var(--type-meta);
}

.work-divider {
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--rule);
}

.work-panel-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

.work-panel-heading :is(h2, h3, h4) {
  font-size: var(--type-panel);
  font-weight: 620;
  line-height: 1.25;
  margin: 0;
}

.work-panel-heading > small {
  color: var(--dim);
  font-size: var(--type-meta);
}

.search-controls {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: var(--space-2);
}

.search-controls > .work-field:first-child {
  grid-column: 1 / -1;
}

.work-field {
  display: grid;
  gap: var(--space-1);
  min-width: 0;
  color: var(--sub);
  font-size: var(--type-label);
  font-weight: 550;
}

.work-field :is(input, select) {
  min-height: 40px;
  width: 100%;
  font: 400 var(--type-ui) / 1.4 var(--sans);
}

@container (min-width: 920px) {
  .search-controls {
    grid-template-columns: minmax(0, 1fr) minmax(132px, 0.66fr) auto;
  }

  .search-controls > .work-field:first-child {
    grid-column: auto;
  }
}

.index-status {
  margin-top: var(--space-3);
  padding-top: var(--space-2);
  border-top: 1px solid var(--rule);
}

.index-status .observed {
  flex: 1 1 200px;
  margin-top: 0;
}

.index-label {
  display: block;
  color: var(--sub);
}

.context-search > p.observed:empty {
  margin: 0;
}

.search-preview {
  margin-top: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--rule);
  border-radius: var(--radius-control);
  background: var(--bg);
}

.search-results-row {
  min-width: 0;
  padding: var(--space-2) 0;
}

.search-results-row > p {
  margin-top: var(--space-1);
}

.source-directory {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-2);
}

.source-directory code {
  color: var(--sub);
}

.source-picker .context-files {
  margin-top: var(--space-3);
}

.source-picker .context-file {
  min-height: 36px;
}

.source-tools {
  display: grid;
  gap: var(--space-2);
  margin-block: var(--space-3);
}

.source-tools summary {
  width: fit-content;
  cursor: pointer;
  color: var(--accent);
  font-size: var(--type-ui);
}

.source-tools .context-selection {
  margin: 0;
}

.task-detail h3 {
  overflow-wrap: anywhere;
}

.task-detail .work-panel-heading h4 {
  font-size: var(--type-body);
}

.task-objective {
  max-width: 76ch;
  white-space: pre-wrap;
}

.task-details {
  margin-top: var(--space-3);
  color: var(--sub);
  font-size: var(--type-ui);
}

.task-details summary {
  width: fit-content;
  cursor: pointer;
  color: var(--accent);
}

.task-dialog .task-fields {
  border: 0;
  padding: 0;
}

.task-dialog .task-form {
  margin-bottom: 0;
}

.task-dialog .dialog-actions {
  margin-top: var(--space-2);
}

.checkout-reading {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-1) var(--space-4);
  margin-bottom: var(--space-4);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--rule);
  border-radius: var(--radius-control);
  background: var(--panel);
  color: var(--sub);
  font-size: var(--type-label);
}

.checkout-reading > div {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-1) var(--space-2);
  min-width: 0;
}

.checkout-reading code {
  overflow-wrap: anywhere;
  color: var(--text);
}

.git-filters {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
  margin-block: var(--space-2) var(--space-3);
}

.git-filter {
  min-height: 32px;
  padding: 3px var(--space-2);
  border: 1px solid var(--rule);
  border-radius: var(--radius-control);
  background: var(--bg);
  color: var(--sub);
  font-size: var(--type-meta);
  font-weight: 560;
}

.git-filter:hover {
  background: var(--raised);
}

.git-filter[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--soft);
  color: var(--text);
}

.git-filter small {
  margin-inline-start: var(--space-1);
  font: inherit;
  font-variant-numeric: tabular-nums;
}

.git-files {
  min-width: 0;
  max-height: 18rem;
  margin: 0;
  padding: 0 2px;
  overflow: auto;
  border: 0;
}

.git-file {
  display: flex;
  min-height: 42px;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2);
  border-bottom: 1px solid var(--rule);
}

.git-file:hover {
  background: var(--raised);
}

.git-file:focus-within {
  outline: 2px solid var(--focus);
  outline-offset: -2px;
}

.git-file input {
  flex: none;
  margin: 0;
}

.git-file > code {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.git-file-kinds {
  display: flex;
  flex: 0 1 auto;
  flex-wrap: wrap;
  justify-content: end;
  gap: var(--space-1);
}

.git-kind {
  padding: 1px 5px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  font-size: var(--type-meta);
  font-weight: 520;
}

.git-kind.staged {
  color: var(--green);
}
.git-kind.unstaged {
  color: var(--yellow);
}
.git-kind.untracked {
  color: var(--sub);
}
.git-kind.conflicted {
  color: var(--red);
}

.git-selection {
  justify-content: space-between;
  margin-top: var(--space-3);
}

.git-provenance {
  margin-block: var(--space-2) var(--space-3);
  color: var(--sub);
  font-size: var(--type-ui);
}

.git-provenance summary {
  width: fit-content;
  color: var(--accent);
  cursor: pointer;
}

.git-diff .work-panel-heading {
  margin-bottom: var(--space-2);
}

.git-diff .work-panel-heading h4 {
  margin: 0;
  font-size: var(--type-ui);
}

.git-diff .diff-versions {
  font-size: var(--type-ui);
}

.git-diff .diff-versions dd {
  color: var(--sub);
  overflow-wrap: anywhere;
}

.git-diff .text-diff {
  margin-bottom: var(--space-2);
}

@container (max-width: 420px) {
  .git-file {
    flex-wrap: wrap;
  }

  .git-file .git-file-kinds {
    flex-basis: 100%;
    justify-content: start;
    padding-inline-start: var(--space-5);
  }
}

@media (forced-colors: active) {
  .work-list-row[aria-current="true"],
  .git-filter[aria-pressed="true"] {
    outline: 1px solid Highlight;
    outline-offset: -1px;
  }
}


.living-shell {
  --sidebar-width: clamp(210px, 16vw, 248px);
  --titlebar-height: 54px;
}

.living-shell .brand {
  gap: 8px;
  padding-inline: 19px;
}

.living-shell .brand-mark {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 1px solid var(--rule);
  border-radius: 9px;
  background: var(--band);
}

.living-shell .brand-mark .lambda-mark {
  width: 24px;
  height: 24px;
}

.living-shell .breadcrumb {
  margin-inline-start: clamp(16px, 2.6vw, 40px);
}
.shell-context {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.command-trigger,
.shell-motion {
  display: inline-flex;
  min-height: 35px;

  margin-inline-end: 8px;

  border: 1px solid var(--control-rule);
  border-radius: var(--radius-control);
  background: var(--sheet);
  color: var(--sub);
  font-size: var(--type-label);
  white-space: nowrap;
}

.command-trigger:hover,
.shell-motion:hover,
.shell-motion[aria-pressed="true"] {
  background: var(--raised);
  color: var(--text);

.command-trigger .visual-icon,
.shell-motion .visual-icon {
  width: 17px;
  height: 17px;
}
kbd {
  padding: 1px 5px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  color: var(--dim);
  font: 11px var(--mono);
}
.shell-motion {

.living-shell .desktop-rail {

.rail-group {

  line-height: 1.25;
  text-align: start;

.rail-link .visual-icon {

  height: 18px;
}
.rail-link:hover {
  background: var(--raised);

}
.rail-link[aria-current="page"] {
  border-color: var(--rule);
  background: var(--soft);
  color: var(--text);
  box-shadow: inset 2px 0 var(--accent);

}
.rail-link[aria-current="page"] .visual-icon {
  color: var(--accent);
}
.rail-link[aria-current="true"] {
  background: var(--raised);
  color: var(--text);
}
.rail-link small {
  margin-inline-start: auto;
  color: var(--dim);

}
.rail-label {

  text-overflow: ellipsis;

.rail-empty {

.rail-foot {

}
.rail-destinations .rail-link {

.rail-previews .rail-link {

.rail-previews .rail-label {

.project-initial {

  border: 1px solid var(--rule);

  background: var(--sheet);
  color: var(--accent);

.living-shell .main {

  padding: clamp(20px, 2.6vw, 42px);

.eyebrow {

.surface-intro {

}
.surface-intro h1 {
  font-size: var(--type-page);

.surface-intro h1 + p {

  color: var(--sub);

.workspace-dashboard {
  display: grid;

  gap: clamp(12px, 1.4vw, 22px);

.workspace-flow,
.continuity-desk {
